
    <div style="display: block">
        <canvas #chart id="combinedChart" baseChart
          [datasets]="combinedChartData"
          [labels]="combinedChartLabels"
          [options]="combinedChartOptions"
          [plugins]="combinedChartPlugins"
          [colors]="combinedChartColors" 
          [legend]="combinedChartLegend"
          [chartType]="'bar'"
          (chartHover)="chartHovered($event)"
          (chartClick)="chartClicked($event)">
        </canvas>
      </div>
