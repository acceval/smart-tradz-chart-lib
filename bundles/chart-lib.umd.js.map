<div>
    <plotly-plot [data]="waterfallData" [layout]="waterfallChartOptions" [config]="waterfallChartConfig" 
      [revision]="0" [debug]="true" [useResizeHandler]="true"
      (click)="chartClicked($event)" (hover)="chartHovered($event)" (afterPlot)="chartAfterPlotted($event)">
    </plotly-plot>
</div>
